version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autoservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"

    volumes:
      - .:/code
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/autoservice_db
    depends_on:
      - db

volumes:
  postgres_data:
